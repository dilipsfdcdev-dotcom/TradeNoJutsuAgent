[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tradenojutsu"
version = "1.0.0"
description = "Self-thinking, self-learning AI trading agent"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "pandas>=2.1.0",
    "numpy>=1.24.0",
    "ta>=0.11.0",
    "yfinance>=0.2.31",
    "ccxt>=4.0.0",
    "anthropic>=0.40.0",
    "lightgbm>=4.1.0",
    "stable-baselines3>=2.2.0",
    "gymnasium>=0.29.0",
    "scikit-learn>=1.3.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "matplotlib>=3.8.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "click>=8.1.0",
    "aiosqlite>=0.19.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
]
mt5 = [
    "MetaTrader5>=5.0.45",
]
telegram = [
    "python-telegram-bot>=20.7",
]
all = [
    "tradenojutsu[telegram]",
]

[project.scripts]
tradenojutsu = "tradenojutsu.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
